name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build RoslynGate.sln -warnaserror --no-restore

      - name: Test
        run: dotnet test RoslynGate.sln --no-build

      - name: Format
        run: dotnet format RoslynGate.sln --verify-no-changes --no-restore
