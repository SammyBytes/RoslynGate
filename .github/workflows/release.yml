name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            asset: roslyngate-linux-x64
            executable: roslyngate
          - rid: win-x64
            asset: roslyngate-win-x64.exe
            executable: roslyngate.exe
          - rid: osx-arm64
            asset: roslyngate-osx-arm64
            executable: roslyngate

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate version
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm run version:check
          manifest_version="$(node -p "require('./version.json').version")"
          test "$version" = "$manifest_version"
          npm test --prefix packaging/npm

      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/RoslynGate.Cli/RoslynGate.Cli.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishReadyToRun=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="$version" \
            -o "artifacts/${{ matrix.rid }}"

          mkdir -p artifacts/release
          cp "artifacts/${{ matrix.rid }}/${{ matrix.executable }}" \
             "artifacts/release/${{ matrix.asset }}"
          cd artifacts/release
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh release
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm token
        id: token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version check
        if: steps.token.outputs.publish == 'true'
        run: npm run version:check

      - name: Build TypeScript
        if: steps.token.outputs.publish == 'true'
        run: |
          npm ci --prefix products/typescript
          npm --prefix products/typescript run build

      - name: Publish TypeScript package
        if: steps.token.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "roslyngate-ts@$version" version >/dev/null 2>&1; then
            echo "roslyngate-ts@$version already exists; skipping."
          else
            npm publish ./products/typescript --access public
          fi

      - name: Publish .NET wrapper
        if: steps.token.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "roslyngate@$version" version >/dev/null 2>&1; then
            echo "roslyngate@$version already exists; skipping."
          else
            npm publish ./packaging/npm --access public
          fi

      - name: npm token missing
        if: steps.token.outputs.publish != 'true'
        run: echo "NPM_TOKEN is not configured; publish both packages manually."
